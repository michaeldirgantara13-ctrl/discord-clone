<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Edit Profil - Discord Clone</title>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #313338;
            color: #dbdee1;
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #2b2d31;
            width: 100%;
            max-width: 360px;
            padding: 28px;
            border-radius: 8px;
            border: 1px solid #1f2023;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 {
            color: white;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 16px auto;
            border: 2px solid #4e5058;
        }

        label {
            font-size: 12px;
            display: block;
            margin-bottom: 6px;
            color: #b5bac1;
            text-align: left;
        }

        input[type="text"],
        input[type="file"] {
            background: #1e1f22;
            color: white;
            border: 1px solid #1f2023;
            padding: 10px;
            border-radius: 4px;
            width: 100%;
            outline: none;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .btn-primary {
            background: #5865F2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .btn-primary:hover {
            background: #4752c4;
        }

        .btn-secondary {
            background: transparent;
            color: #949ba4;
            border: 1px solid #4e5058;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }

        .btn-secondary:hover {
            color: white;
            border-color: #6d6f78;
        }

        #statusMsg {
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            min-height: 16px;
        }

        #statusMsg.success {
            color: #23a55a;
        }

        #statusMsg.error {
            color: #da373c;
        }
    </style>
</head>

<body>

    <div class="card">

        <select
            id="targetLang"
            onchange="changeLanguage(this)"
            title="Pilih Bahasa Terjemahan"
            style="margin-bottom:16px;width:100%;background:#1e1f22;color:white;border:1px solid #1f2023;padding:8px;border-radius:4px;"
        >
            <option value="id">🇮🇩 Indonesia</option>
            <option value="en">🇬🇧 English</option>
            <option value="tr">🇹🇷 Türkçe</option>
            <option value="ms">🇲🇾 Melayu</option>
            <option value="jv">Jawa</option>
            <option value="su">Sunda</option>

            <option value="zh-CN">🇨🇳 中文 (简体)</option>
            <option value="zh-TW">🇹🇼 中文 (繁體)</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="ko">🇰🇷 한국어</option>

            <option value="ar">🇸🇦 العربية</option>
            <option value="fa">🇮🇷 فارسی</option>
            <option value="he">🇮🇱 עברית</option>
            <option value="hi">🇮🇳 हिन्दी</option>
            <option value="bn">🇧🇩 বাংলা</option>
            <option value="ur">🇵🇰 اردو</option>

            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="nl">🇳🇱 Nederlands</option>

            <option value="ru">🇷🇺 Русский</option>
            <option value="uk">🇺🇦 Українська</option>
            <option value="pl">🇵🇱 Polski</option>
            <option value="el">🇬🇷 Ελληνικά</option>

            <option value="th">🇹🇭 ไทย</option>
            <option value="vi">🇻🇳 Tiếng Việt</option>
            <option value="tl">🇵🇭 Filipino</option>

            <option value="sv">🇸🇪 Svenska</option>
            <option value="da">🇩🇰 Dansk</option>
            <option value="no">🇳🇴 Norsk</option>
            <option value="fi">🇫🇮 Suomi</option>
            <option value="cs">🇨🇿 Čeština</option>
            <option value="ro">🇷🇴 Română</option>
            <option value="hu">🇭🇺 Magyar</option>
        </select>

        <h2 id="pageTitle">Edit Profil</h2>

        <img
            id="avatarPreview"
            class="avatar-preview"
            src="https://via.placeholder.com/80"
        >

        <div id="statusMsg"></div>

        <label id="nameLabel">Nama Tampilan</label>

        <input
            type="text"
            id="usernameInput"
            placeholder="Masukkan nama..."
        >

        <label id="avatarChangeLabel">Ganti Foto Profil (opsional)</label>

        <input
            type="file"
            id="avatarInput"
            accept="image/*"
        >

        <button
            id="saveBtn"
            class="btn-primary"
            onclick="saveProfile()"
        >
            Simpan Perubahan
        </button>

        <button
            id="backBtn"
            class="btn-secondary"
            onclick="window.location.href = 'index.html'"
        >
            Kembali ke Chat
        </button>

    </div>

    <script>

        const socket = io();

        /* =========================
           BAHASA (ikut bahasa yang dipilih di index.html)
           ========================= */

        let myTargetLang =
            localStorage.getItem('chat_target_lang') || 'id';

        const UI_TEXT_ID = {
            pageTitle: 'Edit Profil',
            nameLabel: 'Nama Tampilan',
            namePlaceholder: 'Masukkan nama...',
            avatarChangeLabel: 'Ganti Foto Profil (opsional)',
            saveBtn: 'Simpan Perubahan',
            backBtn: 'Kembali ke Chat',
            langSelectTitle: 'Pilih Bahasa Terjemahan',
            avatarTooBigError: 'Foto terlalu besar (maksimal 1MB).',
            nameEmptyError: 'Nama tidak boleh kosong.',
            savingStatus: 'Menyimpan...',
            savedStatus: 'Profil berhasil disimpan!',
            avatarRejectedError: 'Foto terlalu besar (maksimal 1MB). Profil disimpan tanpa foto baru.',
            blockedError: 'Anda diblokir dan tidak bisa mengubah profil.'
        };

        const translationCache = new Map();

        async function translateText(
            text,
            targetLang,
            cacheKey
        ) {

            if (!text) {
                return '';
            }

            const key =
                `${cacheKey}|${targetLang}|${text}`;

            if (translationCache.has(key)) {
                return translationCache.get(key);
            }

            try {

                const controller =
                    new AbortController();

                const timeoutId =
                    setTimeout(
                        () => controller.abort(),
                        4000
                    );

                const res =
                    await fetch(
                        `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`,
                        { signal: controller.signal }
                    );

                clearTimeout(timeoutId);

                const data =
                    await res.json();

                const result =
                    data[0]
                        .map(item => item[0])
                        .join('');

                translationCache.set(key, result);

                return result;

            } catch (err) {

                return text;
            }
        }

        const uiTranslationCache = {};

        function t(key) {

            const master =
                UI_TEXT_ID[key] || key;

            if (myTargetLang === 'id') {
                return master;
            }

            return (
                uiTranslationCache[myTargetLang] &&
                uiTranslationCache[myTargetLang][key]
            ) || master;
        }

        async function loadUITranslations(targetLang) {

            if (targetLang === 'id') {
                return;
            }

            if (!uiTranslationCache[targetLang]) {
                uiTranslationCache[targetLang] = {};
            }

            const cache =
                uiTranslationCache[targetLang];

            await Promise.all(
                Object.entries(UI_TEXT_ID).map(
                    async ([key, text]) => {

                        if (cache[key]) {
                            return;
                        }

                        const translated =
                            await translateText(
                                text,
                                targetLang,
                                `ui:${key}`
                            );

                        cache[key] =
                            translated || text;
                    }
                )
            );
        }

        function applyStaticUITranslations() {

            const setText =
                (id, key) => {
                    const el =
                        document.getElementById(id);
                    if (el) {
                        el.textContent = t(key);
                    }
                };

            setText('pageTitle', 'pageTitle');
            setText('nameLabel', 'nameLabel');
            setText('avatarChangeLabel', 'avatarChangeLabel');
            setText('saveBtn', 'saveBtn');
            setText('backBtn', 'backBtn');

            const usernameInput =
                document.getElementById('usernameInput');
            if (usernameInput) {
                usernameInput.placeholder =
                    t('namePlaceholder');
            }

            const langSelect =
                document.getElementById('targetLang');
            if (langSelect) {
                langSelect.title = t('langSelectTitle');
                langSelect.value = myTargetLang;
            }
        }

        async function changeLanguage(sourceEl) {

            myTargetLang =
                sourceEl
                    ? sourceEl.value
                    : document.getElementById('targetLang').value;

            localStorage.setItem(
                'chat_target_lang',
                myTargetLang
            );

            await loadUITranslations(myTargetLang);

            applyStaticUITranslations();
        }


        // clientId permanen (sama seperti yang dipakai index.html)
        let clientId =
            localStorage.getItem('chat_client_id');

        if (!clientId) {

            clientId =
                (crypto.randomUUID
                    ? crypto.randomUUID()
                    : `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`);

            localStorage.setItem(
                'chat_client_id',
                clientId
            );
        }

        let currentUsername =
            localStorage.getItem('chat_username') || '';

        let currentAvatar =
            localStorage.getItem('chat_avatar') ||
            'https://via.placeholder.com/80';

        let newAvatarData = null;

        // Isi form dengan data yang tersimpan
        document.getElementById(
            'usernameInput'
        ).value = currentUsername;

        document.getElementById(
            'avatarPreview'
        ).src = currentAvatar;

        // Terapkan bahasa yang sudah dipilih sebelumnya
        // (disimpan dari index.html)
        (async function initLanguage() {

            const langSelect =
                document.getElementById('targetLang');

            if (langSelect) {
                langSelect.value = myTargetLang;
            }

            await loadUITranslations(myTargetLang);

            applyStaticUITranslations();

        })();


        document.getElementById(
            'avatarInput'
        ).addEventListener(
            'change',
            function(e) {

                const file =
                    e.target.files[0];

                if (!file) {
                    return;
                }

                if (
                    file.size > 1 * 1024 * 1024
                ) {

                    showStatus(
                        t('avatarTooBigError'),
                        'error'
                    );

                    e.target.value = '';

                    return;
                }

                const reader =
                    new FileReader();

                reader.onload =
                    function(ev) {

                        newAvatarData =
                            ev.target.result;

                        document.getElementById(
                            'avatarPreview'
                        ).src = newAvatarData;
                    };

                reader.readAsDataURL(file);
            }
        );


        function showStatus(msg, type) {

            const el =
                document.getElementById(
                    'statusMsg'
                );

            el.textContent = msg;
            el.className = type || '';
        }


        function saveProfile() {

            const newUsername =
                document
                    .getElementById(
                        'usernameInput'
                    )
                    .value
                    .trim();

            if (!newUsername) {

                showStatus(
                    t('nameEmptyError'),
                    'error'
                );

                return;
            }

            showStatus(
                t('savingStatus'),
                ''
            );

            const payload = {

                username:
                    newUsername,

                avatar:
                    newAvatarData ||
                    currentAvatar,

                clientId:
                    clientId
            };

            if (socket.connected) {

                socket.emit(
                    'set_user_profile',
                    payload
                );

            } else {

                socket.once(
                    'connect',
                    function() {

                        socket.emit(
                            'set_user_profile',
                            payload
                        );
                    }
                );
            }
        }


        socket.on(
            'profile_registered',
            function(payload) {

                const finalAvatar =
                    payload?.avatar ||
                    newAvatarData ||
                    currentAvatar;

                const finalUsername =
                    document
                        .getElementById(
                            'usernameInput'
                        )
                        .value
                        .trim();

                localStorage.setItem(
                    'chat_username',
                    finalUsername
                );

                localStorage.setItem(
                    'chat_avatar',
                    finalAvatar
                );

                showStatus(
                    t('savedStatus'),
                    'success'
                );

                setTimeout(
                    function() {

                        window.location.href =
                            'index.html';
                    },
                    900
                );
            }
        );


        socket.on(
            'avatar_rejected',
            function() {

                showStatus(
                    t('avatarRejectedError'),
                    'error'
                );
            }
        );


        socket.on(
            'you_are_blocked',
            function() {

                showStatus(
                    t('blockedError'),
                    'error'
                );
            }
        );

    </script>

</body>
</html>
