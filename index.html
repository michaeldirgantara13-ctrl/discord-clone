<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>Discord Clone</title>

<script src="/socket.io/socket.io.js"></script>

<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    overflow: hidden;
}

body {
    font-family:
        'Helvetica Neue',
        Helvetica,
        Arial,
        sans-serif;

    background: #313338;
    color: #dbdee1;

    font-size: 18px;

    width: 100vw;

    height: 100vh;
    height: 100dvh;
}


/* =========================================================
   MAIN APP
   ========================================================= */

.main-chat-container {

    display: flex;

    flex-direction: column;

    width: 100vw;
    max-width: none;

    height: 100vh;
    height: 100dvh;

    min-width: 0;
    min-height: 0;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #313338;
}


/* =========================================================
   PROFILE
   ========================================================= */

#profile-modal {

    width: calc(100% - 30px);

    max-width: 500px;

    background: #313338;

    border:
        1px solid #1f2023;

    border-radius: 10px;

    padding: 25px;

    margin: 50px auto;

    text-align: center;

    box-shadow:
        0 8px 24px rgba(0,0,0,.5);
}

#profile-modal h3 {

    color: white;

    margin-top: 0;

    font-size: 27px !important;
}

#profile-modal input {

    font-size: 18px !important;
}

#profile-modal label {

    font-size: 16px !important;
}

#profile-modal button {

    font-size: 18px !important;

    padding:
        13px
        20px !important;
}


/* =========================================================
   HEADER
   ========================================================= */

.chat-header {

    width: 100vw;

    min-height: 70px;

    height: auto;

    flex: 0 0 auto;

    padding:
        6px
        7px;

    display: flex;

    align-items: center;

    background: #313338;

    border-bottom:
        1px solid #1f2023;

    box-shadow:
        0 1px 3px rgba(0,0,0,.25);

    overflow: hidden;
}


.header-right-group {

    width: 100%;

    min-width: 0;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 6px;
}


.vertical-controls {

    flex:
        1
        1
        auto;

    min-width: 0;

    display: flex;

    flex-direction: column;

    gap: 4px;
}


select {

    width: 100%;

    min-width: 0;

    height: 30px;

    background: #1e1f22;

    color: #dbdee1;

    border:
        1px solid #1f2023;

    border-radius: 5px;

    outline: none;

    padding:
        2px
        7px;

    font-size: 16px;
}


#memberBtn,
.chat-header button {

    flex:
        0
        0
        auto;

    min-height: 40px;

    white-space: nowrap;

    border: none;

    border-radius: 5px;

    cursor: pointer;

    font-size: 16px !important;

    padding:
        8px
        10px !important;
}


/* =========================================================
   CHAT BOX
   ========================================================= */

#chat-box {

    width: 100vw;

    flex:
        1
        1
        0;

    min-width: 0;
    min-height: 0;

    height: auto;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        7px
        7px;

    margin: 0;

    background: #313338;

    display: flex;

    flex-direction: column;

    gap: 0;

    -webkit-overflow-scrolling: touch;

    overscroll-behavior:
        contain;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message-row {

    width: 100%;
    max-width: none;

    min-width: 0;

    display: grid;

    grid-template-columns:
        48px
        minmax(0,1fr);

    grid-template-rows:
        auto
        auto
        auto;

    column-gap: 10px;

    align-items: start;

    padding:
        8px
        2px;

    margin: 0;

    border-radius: 5px;

    position: relative;
}


.message-row:hover {

    background: #2e3035;
}


/* =========================================================
   AVATAR
   ========================================================= */

.avatar {

    grid-column: 1;

    grid-row: 1;

    width: 48px;

    height: 48px;

    border-radius: 50%;

    object-fit: cover;

    flex-shrink: 0;

    margin-top: 1px;
}


/* =========================================================
   CONTENT
   ========================================================= */

.message-content-wrapper {

    grid-column: 2;

    grid-row: 1;

    width: 100%;

    max-width: none;

    min-width: 0;

    word-break: break-word;

    overflow-wrap: anywhere;

    margin: 0;

    padding: 0;
}


.message-header {

    display: block;

    width: 100%;

    height: auto;

    margin: 0;

    padding: 0;

    line-height: 23px;
}


.message-username {

    display: block;

    width: 100%;

    font-weight: 600;

    color: white;

    font-size: 18px;

    line-height: 23px;

    margin: 0;

    padding: 0;
}


.message-text {

    display: block;

    width: 100%;

    color: #dbdee1;

    font-size: 18px;

    line-height: 1.45;

    white-space: pre-wrap;

    word-break: break-word;

    overflow-wrap: anywhere;

    margin: 0;

    padding: 0;
}


.translation-text {

    display: block;

    width: 100%;

    color: #23a55a;

    font-size: 15px;

    line-height: 1.4;

    margin:
        4px
        0
        0;

    padding: 0;

    word-break: break-word;

    overflow-wrap: anywhere;
}


/* =========================================================
   IMAGE
   ========================================================= */

.chat-img {

    display: block;

    max-width: 100%;

    max-height: 400px;

    border-radius: 8px;

    margin:
        7px
        0
        0;
}


/* =========================================================
   REPLY INDICATOR
   ========================================================= */

.reply-indicator {

    display: flex;

    align-items: center;

    gap: 5px;

    width: 100%;

    color: #949ba4;

    font-size: 14px;

    line-height: 19px;

    font-style: italic;

    margin:
        0
        0
        3px;

    padding: 0;

    overflow: hidden;
}


.reply-indicator b {

    flex-shrink: 0;
}


/* =========================================================
   ACTION BAR
   DI BAWAH PESAN
   ========================================================= */

.message-actions {

    grid-column: 2;

    grid-row: 2;

    display: none;

    flex-wrap: wrap;

    align-items: center;

    width: fit-content;

    max-width: 100%;

    gap: 3px;

    margin-top: 6px;

    padding: 4px;

    background: #2b2d31;

    border:
        1px solid #1f2023;

    border-radius: 6px;

    box-shadow:
        0 2px 5px rgba(0,0,0,.35);

    z-index: 100;
}


.message-row.show-actions
.message-actions {

    display: flex;
}


/* =========================================================
   ACTION BUTTON
   ========================================================= */

.action-icon-btn {

    background: transparent;

    border: none;

    color: #b5bac1;

    padding:
        8px
        10px;

    cursor: pointer;

    font-size: 20px;

    line-height: 1;

    border-radius: 5px;

    min-width: 38px;

    min-height: 38px;
}


.action-icon-btn:hover,
.action-icon-btn:active {

    background: #404249;

    color: white;
}


/* =========================================================
   EMOJI PICKER
   ========================================================= */

.emoji-picker-dialog {

    grid-column: 2;

    grid-row: 3;

    display: none;

    width:
        min(
            340px,
            calc(100vw - 65px)
        );

    max-width: 100%;

    max-height: 260px;

    margin-top: 5px;

    padding: 10px;

    background: #313338;

    border:
        1px solid #1f2023;

    border-radius: 8px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.5);

    overflow-y: auto;

    z-index: 200;
}


.emoji-picker-dialog.show {

    display: block;
}


.emoji-grid {

    display: flex;

    flex-wrap: wrap;

    gap: 4px;
}


.emoji-item {

    width: 42px;

    height: 42px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    cursor: pointer;

    border-radius: 5px;

    user-select: none;
}


.emoji-item:hover {

    background: #404249;
}


/* =========================================================
   REACTION
   ========================================================= */

.reaction-container {

    display: flex;

    flex-wrap: wrap;

    gap: 5px;

    width: 100%;

    margin:
        6px
        0
        0;

    padding: 0;
}


.reaction-btn {

    background: #2b2d31;

    border:
        1px solid transparent;

    border-radius: 17px;

    padding:
        4px
        10px;

    font-size: 16px;

    color: #b5bac1;

    cursor: pointer;

    display: flex;

    align-items: center;

    gap: 5px;
}


.reaction-btn:hover {

    border-color: #4f545c;

    background: #35373c;
}


.reaction-btn.active {

    background: #313338;

    border-color: #5865F2;

    color: white;
}


/* =========================================================
   EDIT
   ========================================================= */

.edit-box {

    display: flex;

    flex-wrap: wrap;

    align-items: center;

    gap: 5px;

    margin-top: 6px;

    width: 100%;
}


.edit-input {

    flex: 1;

    min-width: 120px;

    background: #1e1f22;

    color: white;

    border:
        1px solid #5865F2;

    border-radius: 5px;

    outline: none;

    padding: 9px;

    font-size: 18px;
}


.edit-save,
.edit-cancel {

    border: none;

    border-radius: 5px;

    cursor: pointer;

    font-weight: bold;

    font-size: 15px;

    padding:
        8px
        11px;
}


.edit-save {

    background: #248046;

    color: white;
}


.edit-cancel {

    background: #4e5058;

    color: white;
}


/* =========================================================
   BOTTOM PANEL
   ========================================================= */

.bottom-panel {

    width: 100vw;

    max-width: none;

    flex:
        0
        0
        auto;

    padding:
        0
        7px
        7px;

    margin: 0;

    background: #313338;
}


#typing-indicator {

    width: 100%;

    height: 20px;

    margin:
        0
        3px
        2px;

    color: #949ba4;

    font-size: 13px;

    line-height: 20px;

    font-style: italic;

    overflow: hidden;
}


.input-wrapper {

    width: 100%;

    max-width: none;

    background: #383a40;

    border:
        1px
        solid
        transparent;

    border-radius: 8px;

    padding:
        6px
        8px;

    display: flex;

    flex-direction: column;
}


.input-wrapper:focus-within {

    border-color: #4e5058;
}


/* =========================================================
   REPLY PREVIEW
   ========================================================= */

.reply-preview-bar {

    display: none;

    width: 100%;

    align-items: center;

    justify-content: space-between;

    background: #2b2d31;

    border-radius: 5px;

    padding:
        6px
        8px;

    margin-bottom: 5px;

    font-size: 14px;

    color: #b5bac1;
}


.reply-preview-text {

    flex: 1;

    min-width: 0;

    text-align: left;

    margin-right: 8px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.cancel-reply-btn {

    flex-shrink: 0;

    background: none;

    border: none;

    color: #949ba4;

    cursor: pointer;

    font-size: 24px;

    padding:
        0
        5px;
}


/* =========================================================
   INPUT
   ========================================================= */

.input-container {

    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 4px;
}


textarea#messageInput {

    display: block;

    width: 100%;

    height: 52px;

    min-height: 52px;

    max-height: 140px;

    background: transparent;

    color: white;

    border: none;

    outline: none;

    resize: none;

    font-family: inherit;

    font-size: 18px;

    line-height: 1.4;

    padding:
        5px
        0;

    margin: 0;
}


textarea#messageInput::placeholder {

    color: #949ba4;
}


/* =========================================================
   INPUT BUTTON BAR
   ========================================================= */

.input-actions-bar {

    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-top:
        1px
        solid
        #3f4248;

    padding-top: 6px;
}


.file-upload-btn {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    background: #4e5058;

    color: white;

    padding:
        7px
        10px;

    border-radius: 5px;

    font-size: 14px;

    cursor: pointer;

    font-weight: 500;
}


.file-upload-btn:hover {

    background: #6d6f78;
}


.send-btn {

    background: #5865F2;

    color: white;

    border: none;

    border-radius: 5px;

    padding:
        8px
        15px;

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;
}


.send-btn:hover {

    background: #4752c4;
}


#fileName {

    font-size: 12px !important;

    margin-left: 4px !important;
}


/* =========================================================
   MEMBER DIALOG
   ========================================================= */

.modal-overlay {

    display: none;

    position: fixed;

    inset: 0;

    width: 100vw;

    height: 100vh;
    height: 100dvh;

    background:
        rgba(0,0,0,.7);

    z-index: 300;
}


.dialog-box {

    width:
        calc(100% - 24px);

    max-width: 500px;

    max-height: 80dvh;

    overflow-y: auto;

    margin:
        45px
        auto;

    padding: 20px;

    background: #313338;

    border:
        1px
        solid
        #1f2023;

    border-radius: 10px;

    position: relative;
}


.dialog-box h3 {

    margin-top: 0 !important;

    padding-bottom: 10px !important;

    font-size: 24px !important;
}


.close-dialog {

    position: absolute;

    top: 9px;

    right: 12px;

    background: none;

    border: none;

    color: #949ba4;

    font-size: 30px;

    cursor: pointer;
}


.close-dialog:hover {

    color: white;
}


/* =========================================================
   GENERAL INPUT
   ========================================================= */

input[type="text"],
input[type="file"] {

    width: 100%;

    background: #1e1f22;

    color: white;

    border:
        1px
        solid
        #1f2023;

    border-radius: 5px;

    outline: none;

    padding: 10px;

    font-size: 18px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    body {

        font-size: 18px;
    }


    .main-chat-container {

        width: 100vw;

        height: 100vh;
        height: 100dvh;
    }


    .chat-header {

        min-height: 72px;

        padding:
            6px
            6px;
    }


    .header-right-group {

        gap: 5px;
    }


    .vertical-controls {

        gap: 4px;
    }


    select {

        height: 31px;

        font-size: 16px;

        padding:
            3px
            6px;
    }


    #memberBtn,
    .chat-header button {

        min-height: 43px;

        font-size: 15px !important;

        padding:
            8px
            9px !important;
    }


    #chat-box {

        width: 100vw;

        padding:
            6px
            6px;
    }


    .message-row {

        width: 100%;

        grid-template-columns:
            48px
            minmax(0,1fr);

        column-gap: 9px;

        padding:
            8px
            1px;
    }


    .avatar {

        width: 48px;

        height: 48px;
    }


    .message-username {

        font-size: 18px;

        line-height: 23px;
    }


    .message-text {

        font-size: 18px;

        line-height: 1.45;
    }


    .translation-text {

        font-size: 15px;
    }


    .message-actions {

        max-width:
            calc(100vw - 62px);
    }


    .action-icon-btn {

        font-size: 20px;

        min-width: 39px;

        min-height: 39px;

        padding:
            8px
            9px;
    }


    .emoji-picker-dialog {

        width:
            min(
                340px,
                calc(100vw - 62px)
            );

        max-height: 270px;
    }


    .emoji-item {

        width: 43px;

        height: 43px;

        font-size: 28px;
    }


    .bottom-panel {

        width: 100vw;

        padding:
            0
            6px
            6px;
    }


    #typing-indicator {

        height: 20px;

        font-size: 13px;
    }


    .input-wrapper {

        padding:
            6px
            8px;
    }


    textarea#messageInput {

        height: 54px;

        min-height: 54px;

        font-size: 18px;
    }


    .file-upload-btn {

        font-size: 13px;

        padding:
            8px
            9px;
    }


    .send-btn {

        font-size: 15px;

        padding:
            8px
            15px;
    }
}


/* =========================================================
   SAFE AREA
   ========================================================= */

@supports (padding-bottom: env(safe-area-inset-bottom)) {

    .bottom-panel {

        padding-bottom:
            max(
                6px,
                env(safe-area-inset-bottom)
            );
    }
}

</style>
</head>


<body>


<!-- =========================================================
     PROFILE
     ========================================================= -->

<div id="profile-modal">

    <h3 style="color:white;margin-top:0;">
        Atur Profil Anda
    </h3>

    <input
        type="text"
        id="usernameInput"
        placeholder="Masukkan nama..."
        style="margin-bottom:12px;"
    >

    <br>

    <label
        style="
            display:block;
            margin-bottom:6px;
            color:#b5bac1;
            text-align:left;
        "
    >
        Pilih Foto Profil:
    </label>

    <input
        type="file"
        id="avatarInput"
        accept="image/*"
        style="margin-bottom:18px;"
    >

    <br>

    <button
        onclick="joinChat()"
        style="
            background:#5865F2;
            color:white;
            border:none;
            border-radius:5px;
            font-weight:bold;
            cursor:pointer;
            width:100%;
        "
    >
        Gabung Chat
    </button>

</div>


<!-- =========================================================
     MEMBER DIALOG
     ========================================================= -->

<div
    id="memberDialog"
    class="modal-overlay"
>

    <div class="dialog-box">

        <button
            class="close-dialog"
            onclick="toggleMemberDialog()"
        >
            &times;
        </button>

        <h3
            style="
                margin-top:0;
                color:white;
                border-bottom:1px solid #3f4248;
            "
        >
            Anggota Online
        </h3>

        <div
            id="member-list"
            style="margin-top:15px;"
        ></div>

    </div>

</div>


<!-- =========================================================
     CHAT
     ========================================================= -->

<div
    id="app-container"
    style="display:none;"
    class="main-chat-container"
>


    <!-- HEADER -->

    <div class="chat-header">

        <div class="header-right-group">

            <div class="vertical-controls">

                <select
                    id="channelSelect"
                    onchange="changeChannelHeader()"
                >

                    <option value="umum">
                        # umum
                    </option>

                    <option value="gaming">
                        # gaming
                    </option>

                    <option value="musik">
                        # musik
                    </option>

                </select>


                <select
                    id="targetLang"
                    onchange="changeLanguage()"
                    title="Pilih Bahasa Terjemahan"
                >

                    <option value="id">
                        🇮🇩 Indonesia
                    </option>

                    <option value="en">
                        🇬🇧 English
                    </option>

                    <option value="ms">
                        🇲🇾 Melayu
                    </option>

                    <option value="jv">
                        Jawa
                    </option>

                    <option value="su">
                        Sunda
                    </option>

                    <option value="zh-CN">
                        🇨🇳 Mandarin
                    </option>

                    <option value="ja">
                        🇯🇵 Japanese
                    </option>

                    <option value="ko">
                        🇰🇷 Korean
                    </option>

                    <option value="ar">
                        🇸🇦 Arabic
                    </option>

                    <option value="es">
                        🇪🇸 Spanish
                    </option>

                </select>

            </div>


            <button
                onclick="toggleMemberDialog()"
                id="memberBtn"
                style="
                    background:#35373c;
                    color:#dbdee1;
                    border:none;
                    border-radius:5px;
                    cursor:pointer;
                "
            >
                👥 (0)
            </button>


            <button
                onclick="clearAllChat()"
                style="
                    background:#da373c;
                    color:white;
                    border:none;
                    border-radius:5px;
                    cursor:pointer;
                "
            >
                🗑️ Hapus
            </button>

        </div>

    </div>


    <!-- CHAT BOX -->

    <div id="chat-box"></div>


    <!-- INPUT -->

    <div class="bottom-panel">

        <div id="typing-indicator"></div>


        <div class="input-wrapper">


            <div
                id="replyPreviewBar"
                class="reply-preview-bar"
            >

                <span
                    id="replyPreviewText"
                    class="reply-preview-text"
                >
                    Membalas ke...
                </span>


                <button
                    class="cancel-reply-btn"
                    onclick="cancelReply()"
                >
                    &times;
                </button>

            </div>


            <div class="input-container">

                <textarea
                    id="messageInput"
                    placeholder="Ketik pesan..."
                    oninput="handleTyping()"
                    onkeypress="handleKeyPress(event)"
                ></textarea>


                <div class="input-actions-bar">

                    <div>

                        <input
                            type="file"
                            id="imageInput"
                            accept="image/*"
                            style="display:none;"
                            onchange="updateFileLabel()"
                        >


                        <label
                            for="imageInput"
                            id="fileBtn"
                            class="file-upload-btn"
                        >
                            📎 Unggah Gambar
                        </label>


                        <span
                            id="fileName"
                            style="color:#23a55a;"
                        ></span>

                    </div>


                    <button
                        id="sendBtn"
                        class="send-btn"
                        type="button"
                        onclick="sendMessage()"
                    >
                        Kirim
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SOCKET
   ========================================================= */

const socket = io();

let username = '';

let userAvatar =
    'https://via.placeholder.com/64';

let myTargetLang = 'id';

let messageHistory = [];

let typingTimeout = null;

let replyingToId = null;


/* =========================================================
   SOCKET CONNECTION
   ========================================================= */

socket.on(
    'connect',
    function() {

        console.log(
            'Socket terhubung:',
            socket.id
        );

        if (username) {

            socket.emit(
                'set_user_profile',
                {
                    username:

                    avatar:
                        userAvatar
                }
            );
        }
    }
);

    'connect_error',
    function(error) {

        console.error(
            'Socket error:',
            error
        );

/* =========================================================
   LOAD PROFILE
   ========================================================= */

window.onload =
function() {

    const savedName =
        localStorage.getItem(
            'chat_username'
        );


    const savedAvatar =
        localStorage.getItem(
            'chat_avatar'
        );


    if (savedName) {

        if (savedAvatar) {

            userAvatar =
                savedAvatar;
        }


        registerAndEnter();

   MEMBER
   ========================================================= */

function toggleMemberDialog() {

    const modal =
        document.getElementById(
            'memberDialog'
        );


    modal.style.display =
        modal.style.display === 'block'

            : 'block';

/* =========================================================
   JOIN
   ========================================================= */

function joinChat() {

    const nameVal =
        document
            .getElementById(
                'usernameInput'
            )
            .value
            .trim();


    if (!nameVal) {

        alert(
            'Nama tidak boleh kosong!'
        );

        return;
    }


    username =
        nameVal;


    localStorage.setItem(
        'chat_username',
        username
    );


    const avatarFile =
        document
            .getElementById(
                'avatarInput'
            )
            .files[0];


    if (avatarFile) {

        const reader =
            new FileReader();


        reader.onload =
        function(e) {

            userAvatar =
                e.target.result;


            localStorage.setItem(
                'chat_avatar',
                userAvatar
            );


            registerAndEnter();
        };


        reader.readAsDataURL(
            avatarFile
        );

    } else {

        localStorage.setItem(
            'chat_avatar',
            userAvatar
        );


        registerAndEnter();
    }
}


function registerAndEnter() {

    if (socket.connected) {

        socket.emit(
            'set_user_profile',
            {
                username:
                    username,

                avatar:
                    userAvatar
            }
        );
    }


    document.getElementById(
        'profile-modal'
    ).style.display =
        'none';


    document.getElementById(
        'app-container'
    ).style.display =
        'flex';
}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ''
    ).replace(
        /[&<>"']/g,
        function(ch) {

            return {

                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'

            }[ch];

        }
    );
}


/* =========================================================
   LINKIFY
   ========================================================= */

function linkify(text) {

    const escaped =
        escapeHtml(text);


    return escaped.replace(
        /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig,

        '<a href="$1" target="_blank" rel="noopener noreferrer" style="color:#00b0f4;text-decoration:underline;">$1</a>'
    );
}


/* =========================================================
   TRANSLATE
   ========================================================= */

async function translateText(
    text,
    targetLang
) {

    if (!text) {

        return '';
    }


    try {

        const res =
            await fetch(
                `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`
            );


        const data =
            await res.json();


        return data[0]
            .map(
                item =>
                    item[0]
            )
            .join('');

    } catch (err) {

        return text;
    }
}


/* =========================================================
   SOUND
   ========================================================= */

function playNotificationSound() {

    try {

        const audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const osc =
            audioCtx.createOscillator();


        const gain =
            audioCtx.createGain();


        osc.type =
            'sine';


        osc.frequency.value =
            587.33;


        gain.gain.setValueAtTime(
            0.1,
            audioCtx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.15
        );


        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );


        osc.start();


        osc.stop(
            audioCtx.currentTime + 0.15
        );

    } catch (e) {}
}


/* =========================================================
   REPLY
   ========================================================= */

function startReply(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const msg =
        messageHistory.find(
            m =>
                String(m.id) ===
                String(id)
        );


    if (!msg) {

        return;
    }


    replyingToId =
        id;


    const previewBar =
        document.getElementById(
            'replyPreviewBar'
        );


    const previewText =
        document.getElementById(
            'replyPreviewText'
        );


    if (
        previewBar &&
        previewText
    ) {

        previewText.textContent =
            `Membalas ke ${msg.sender}: ${msg.original || '[Gambar]'}`;


        previewBar.style.display =
            'flex';
    }


    closeAllMessageActions();


    document.getElementById(
        'messageInput'
    ).focus();
}


function cancelReply() {

    replyingToId =
        null;


    const previewBar =
        document.getElementById(
            'replyPreviewBar'
        );


    const previewText =
        document.getElementById(
            'replyPreviewText'
        );


    if (previewBar) {

        previewBar.style.display =
            'none';
    }


    if (previewText) {

        previewText.textContent =
            '';
    }
}

   ACTION BAR
   ========================================================= */

function toggleMessageActions(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const row =
        document.getElementById(
            `message-container-${id}`
        );


    if (!row) {

        return;
    }


    const wasOpen =
        row.classList.contains(
            'show-actions'
        );


    closeAllMessageActions();


    if (!wasOpen) {

        row.classList.add(
            'show-actions'
        );
    }
}


function closeAllMessageActions() {

    document
        .querySelectorAll(
            '.message-row.show-actions'
        )
        .forEach(
            function(el) {

                el.classList.remove(
                    'show-actions'
                );
            }
        );


    document
        .querySelectorAll(
            '.emoji-picker-dialog.show'
        )
        .forEach(
            function(el) {

                el.classList.remove(
                    'show'
                );
            }
        );
}

   EMOJI
   ========================================================= */

function toggleEmojiPicker(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const row =
        document.getElementById(
            `message-container-${id}`
        );


    const picker =

    if (!row || !picker) {

    const wasOpen =

    if (!wasOpen) {

        row.classList.add(
            'show-actions'
        );


        picker.classList.add(

        );
    }
}


/* =========================================================
   REACTION
   ========================================================= */

function addReaction(
    id,
    emoji,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    id =
        String(id);

    emoji =
        String(emoji);


    if (!socket.connected) {

        return;
    }


    if (!id || !emoji) {

        return;
    }


    socket.emit(
        'add_reaction',
        {
            id:
                id,

            emoji:
                emoji
        }
    );


    const picker =
        document.getElementById(
            `emoji-picker-${id}`
        );


    if (picker) {

        picker.classList.remove(
            'show'
        );
    }
}

/* =========================================================
   RENDER CHAT
   ========================================================= */

async function renderChat() {

    const chatBox =
        document.getElementById(
            'chat-box'
        );


    if (!chatBox) {

        return;
    }


    chatBox.innerHTML =
        '';


    for (
        const data
        of messageHistory
    ) {

        const id =
            String(data.id);


        let contentHtml =
            '';


        /* =====================================================
           REPLY
           ===================================================== */

        const parentMsg =
            data.replyTo
                ? messageHistory.find(
                    m =>
                        String(m.id) ===
                        String(data.replyTo)
                )
                : null;


        if (parentMsg) {

            contentHtml += `

                <div class="reply-indicator">

                    ↪️

                    <b>
                        ${escapeHtml(parentMsg.sender)}
                    </b>:

                    ${escapeHtml(
                        parentMsg.original ||
                        '[Gambar]'
                    )}

                </div>

            `;
        }


        /* =====================================================
           TEXT
           ===================================================== */

        if (data.original) {

            const translated =
                await translateText(
                    data.original,
                    myTargetLang
                );


            contentHtml += `

                <div
                    class="message-text"
                    id="msg-text-${escapeHtml(id)}"
                >
                    ${linkify(data.original)}
                    ${
                        data.edited
                            ? ' <small>(diedit)</small>'
                            : ''
                    }
                </div>

            `;


            if (
                translated &&
                translated !==
                data.original
            ) {

                contentHtml += `

                    <small
                        class="translation-text"
                    >
                        🌐
                        (Terjemahan
                        [${escapeHtml(myTargetLang)}]:
                        ${linkify(translated)})
                    </small>

                `;
            }
        }


        /* =====================================================
           IMAGE
           ===================================================== */

        if (data.image) {

            contentHtml += `

                <img
                    src="${escapeHtml(data.image)}"
                    class="chat-img"
                >

            `;
        }


        /* =====================================================
           REACTIONS
           ===================================================== */

        let reactionsHtml =
            '';


        if (
            data.reactions &&
            Object.keys(
                data.reactions
            ).length > 0
        ) {

            reactionsHtml =
                '<div class="reaction-container">';


            for (
                const [
                    emoji,
                    usersList
                ]
                of Object.entries(
                    data.reactions
                )
            ) {

                const hasReacted =
                    Array.isArray(
                        usersList
                    ) &&
                    usersList.includes(
                        username
                    );


                const safeId =
                    JSON.stringify(id);


                const safeEmoji =
                    JSON.stringify(
                        emoji
                    );


                reactionsHtml += `

                    <button
                        type="button"
                        class="reaction-btn ${hasReacted ? 'active' : ''}"
                        onclick='addReaction(${safeId}, ${safeEmoji}, event)'
                    >

                        ${escapeHtml(emoji)}

                        <span
                            class="reaction-count"
                        >
                            ${
                                Array.isArray(
                                    usersList
                                )
                                    ? usersList.length
                                    : 0
                            }
                        </span>

                    </button>

                `;
            }


            reactionsHtml +=
                '</div>';
        }


        /* =====================================================
           ACTIONS
           ===================================================== */

        let actionButtonsHtml = `

            <button
                type="button"
                class="action-icon-btn"
                onclick='startReply(${JSON.stringify(id)}, event)'
                title="Balas"
            >
                ↩️
            </button>

        `;


        actionButtonsHtml += `

            <button
                type="button"
                class="action-icon-btn"
                onclick='toggleEmojiPicker(${JSON.stringify(id)}, event)'
                title="Reaksi"
            >
                😀
            </button>

        `;


        actionButtonsHtml += `

            <button
                type="button"
                class="action-icon-btn"
                onclick='copyText(${JSON.stringify(data.original || '')}, this); event.stopPropagation();'
                title="Salin"
            >
                📋
            </button>

        `;


        if (
            data.sender === username &&
            data.original
        ) {

            actionButtonsHtml += `

                <button
                    type="button"
                    class="action-icon-btn"
                    onclick='enableEdit(${JSON.stringify(id)}, event)'
                    title="Edit"
                >
                    ✏️
                </button>

            `;
        }


        if (
            data.sender === username
        ) {

            actionButtonsHtml += `

                <button
                    type="button"
                    class="action-icon-btn"
                    onclick='deleteMessage(${JSON.stringify(id)}, event)'
                    title="Hapus"
                >
                    🗑️
                </button>

            `;
        }


        /* =====================================================
           EMOJI LIST
           ===================================================== */

        const emojiList = [

            '👍',
            '❤️',
            '😂',
            '😮',
            '😢',
            '🔥',
            '🎉',
            '🙏'

        ];


        let emojiHtml =
            '';


        for (
            const emoji
            of emojiList
        ) {

            emojiHtml += `

                <div
                    class="emoji-item"
                    onclick='addReaction(${JSON.stringify(id)}, ${JSON.stringify(emoji)}, event)'
                >
                    ${emoji}
                </div>

            `;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        chatBox.innerHTML += `

            <div
                class="message-row"
                id="message-container-${escapeHtml(id)}"
                onclick='toggleMessageActions(${JSON.stringify(id)}, event)'
            >


                <img
                    src="${escapeHtml(
                        data.avatar ||
                        'https://via.placeholder.com/64'
                    )}"
                    class="avatar"
                >


                <div
                    class="message-content-wrapper"
                >

                    <div
                        class="message-header"
                    >

                        <span
                            class="message-username"
                        >
                            ${escapeHtml(
                                data.sender
                            )}
                        </span>

                    </div>


                    ${contentHtml}

                    ${reactionsHtml}

                </div>


                <div
                    class="message-actions"
                    onclick="event.stopPropagation()"
                >

                    ${actionButtonsHtml}

                </div>


                <div
                    id="emoji-picker-${escapeHtml(id)}"
                    class="emoji-picker-dialog"
                    onclick="event.stopPropagation()"
                >

                    <div class="emoji-grid">

                        ${emojiHtml}

                    </div>

                </div>


            </div>

        `;
    }


    chatBox.scrollTop =
        chatBox.scrollHeight;
}


/* =========================================================
   EDIT
   ========================================================= */

function enableEdit(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const textEl =
        document.getElementById(
            `msg-text-${id}`
        );


    const msg =
        messageHistory.find(
            m =>
                String(m.id) ===
                String(id)
        );


    if (!textEl || !msg) {

        return;
    }


    if (
        document.getElementById(
            `edit-box-${id}`
        )
    ) {

        return;
    }


    const editDiv =
        document.createElement(
            'div'
        );


    editDiv.id =
        `edit-box-${id}`;


    editDiv.className =
        'edit-box';


    editDiv.innerHTML = `

        <input
            type="text"
            id="edit-input-${escapeHtml(id)}"
            class="edit-input"
        >


        <button
            type="button"
            class="edit-save"
            onclick='saveEdit(${JSON.stringify(id)}, event)'
        >
            Simpan
        </button>


        <button
            type="button"
            class="edit-cancel"
            onclick='cancelEdit(${JSON.stringify(id)}, event)'
        >
            Batal
        </button>

    `;


    textEl.style.display =
        'none';


    textEl.parentNode.insertBefore(
        editDiv,
        textEl.nextSibling
    );


    const input =
        document.getElementById(
            `edit-input-${id}`
        );


    if (!input) {

        return;
    }


    input.value =
        msg.original || '';


    input.focus();

    input.select();
}


function cancelEdit(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const editBox =
        document.getElementById(
            `edit-box-${id}`
        );


    const textEl =
        document.getElementById(
            `msg-text-${id}`
        );


    if (editBox) {

        editBox.remove();
    }


    if (textEl) {

        textEl.style.display =
            '';
    }
}


function saveEdit(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const inputEl =
        document.getElementById(
            `edit-input-${id}`
        );


    if (!inputEl) {

        return;
    }


    const newText =
        inputEl.value.trim();


    if (!newText) {

        return;
    }


    socket.emit(
        'edit_message',
        {
            id:
                id,

            newText:
                newText
        }
    );


    const editBox =
        document.getElementById(
            `edit-box-${id}`
        );


    const textEl =
        document.getElementById(
            `msg-text-${id}`
        );


    if (editBox) {

        editBox.remove();
    }


    if (textEl) {

        textEl.style.display =
            '';
    }


    closeAllMessageActions();
}


/* =========================================================
   COPY
   ========================================================= */

function copyText(
    text,
    btnElement
) {

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
            .writeText(text)
            .then(
                function() {

                    const orig =
                        btnElement.innerHTML;


                    btnElement.innerHTML =
                        '✅';


                    setTimeout(
                        function() {

                            btnElement.innerHTML =
                                orig;

                        },
                        1500
                    );
                }
            )
            .catch(
                function() {}
            );

    } else {

        const temp =
            document.createElement(
                'textarea'
            );


        temp.value =
            text;


        document.body.appendChild(
            temp
        );


        temp.select();


        try {

            document.execCommand(
                'copy'
            );

        } catch (e) {}


        temp.remove();
    }
}

/* =========================================================
   ENTER
   ========================================================= */

function handleKeyPress(e) {

    if (
        e.key === 'Enter' &&
        !e.shiftKey
    ) {

        e.preventDefault();

        sendMessage();
    }
}


/* =========================================================
   TYPING
   ========================================================= */

function handleTyping() {

    socket.emit(
        'typing',
        username
    );


    clearTimeout(
        typingTimeout
    );


    typingTimeout =
        setTimeout(
            function() {

                socket.emit(
                    'stop_typing'
                );

            },
            1000
        );
}


/* =========================================================
   SEND
   ========================================================= */

function sendMessage() {

    const messageInput =
        document.getElementById(
            'messageInput'
        );


    const imageInput =
        document.getElementById(
            'imageInput'
        );


    const message =
        messageInput.value.trim();


    if (
        !message &&
        imageInput.files.length === 0
    ) {

        return;
    }


    socket.emit(
        'stop_typing'
    );


    const messageData = {

        sender:
            username,

        avatar:
            userAvatar,

        original:
            message,

        image:
            null,

        replyTo:
            replyingToId

    };


    if (
        imageInput.files.length > 0
    ) {

        const reader =
            new FileReader();


        reader.onload =
        function(e) {

            messageData.image =
                e.target.result;


            socket.emit(
                'send_message',
                messageData
            );


            resetForm();
        };


        reader.readAsDataURL(
            imageInput.files[0]
        );

    } else {

        socket.emit(
            'send_message',
            messageData
        );


        resetForm();
    }
}


/* =========================================================
   RESET
   ========================================================= */

function resetForm() {

    document.getElementById(
        'messageInput'
    ).value =
        '';


    document.getElementById(
        'imageInput'
    ).value =
        '';


    document.getElementById(
        'fileName'
    ).innerText =
        '';


    cancelReply();
}


/* =========================================================
   HISTORY
   ========================================================= */

socket.on(
    'receive_history',
    async function(history) {

        if (
            messageHistory.length > 0 &&
            history.length >
            messageHistory.length
        ) {

            const latestMsg =
                history[
                    history.length - 1
                ];


            if (
                latestMsg &&
                latestMsg.sender !==
                username
            ) {

                playNotificationSound();
            }
        }


        messageHistory =
            Array.isArray(history)
                ? history
                : [];


        await renderChat();
    }
);


socket.on(
    'message_deleted',
    async function(history) {

        messageHistory =
            Array.isArray(history)
                ? history
                : [];


        await renderChat();
    }
);


socket.on(
    'message_edited',
    async function(history) {

        messageHistory =
            Array.isArray(history)
                ? history
                : [];


        await renderChat();
    }
);


socket.on(
    'reaction_updated',
    async function(history) {

        messageHistory =
            Array.isArray(history)
                ? history
                : [];


        await renderChat();
    }
);


/* =========================================================
   TYPING DISPLAY
   ========================================================= */

socket.on(
    'display_typing',
    function(typingUser) {

        document.getElementById(
            'typing-indicator'
        ).innerText =
            `${typingUser} sedang mengetik...`;
    }
);


socket.on(
    'hide_typing',
    function() {

        document.getElementById(
            'typing-indicator'
        ).innerText =
            '';
    }
);


/* =========================================================
   USERS
   ========================================================= */

socket.on(
    'update_users',
    function(users) {

        users =
            Array.isArray(users)
                ? users
                : [];


        const onlineCount =
            users.length;


        document.getElementById(
            'memberBtn'
        ).innerText =
            `👥 (${onlineCount})`;


        const memberList =
            document.getElementById(
                'member-list'
            );


        memberList.innerHTML =
            '';


        users.forEach(
            function(user) {

                memberList.innerHTML += `

                    <div
                        style="
                            display:flex;
                            align-items:center;
                            margin-bottom:12px;
                            gap:9px;
                        "
                    >

                        <span
                            style="
                                width:9px;
                                height:9px;
                                background-color:#23a55a;
                                border-radius:50%;
                            "
                        ></span>


                        <img
                            src="${escapeHtml(
                                user.avatar ||
                                'https://via.placeholder.com/64'
                            )}"
                            class="avatar"
                            style="
                                width:42px;
                                height:42px;
                                margin-top:0;
                            "
                        >


                        <span
                            style="
                                color:white;
                                font-size:18px;
                                font-weight:500;
                            "
                        >
                            ${escapeHtml(
                                user.username
                            )}
                        </span>

                    </div>

                `;
            }
        );

    }
);

</script>

</body>
</html>
