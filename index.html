<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover"
    >

    <title>Discord Clone - TEST</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        /* =====================================================
           TES UTAMA
           JIKA FILE INI BENAR-BENAR DIPAKAI:
           
           BACKGROUND = MERAH
           NAMA       = HIJAU 36PX
           PESAN      = KUNING 36PX
           ===================================================== */

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: red !important;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        * {
            box-sizing: border-box;
        }


        /* =====================================================
           APP
           ===================================================== */

        .main-chat-container {

            display: flex;

            flex-direction: column;

            width: 100vw;

            height: 100vh;
            height: 100dvh;

            background: red !important;

            overflow: hidden;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .chat-header {

            width: 100%;

            min-height: 75px;

            padding: 8px;

            display: flex;

            align-items: center;

            background: #313338;

            border-bottom:
                1px solid #1f2023;

            flex-shrink: 0;
        }


        .header-right-group {

            width: 100%;

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .vertical-controls {

            flex: 1;

            display: flex;

            flex-direction: column;

            gap: 5px;

            min-width: 0;
        }


        select {

            width: 100%;

            height: 31px;

            background: #1e1f22;

            color: white;

            border: 1px solid #1f2023;

            border-radius: 5px;

            font-size: 18px !important;
        }


        #memberBtn,
        .chat-header button {

            min-height: 43px;

            padding:
                8px
                11px;

            border: none;

            border-radius: 5px;

            font-size: 17px !important;

            white-space: nowrap;
        }


        /* =====================================================
           CHAT
           ===================================================== */

        #chat-box {

            flex: 1;

            min-height: 0;

            width: 100%;

            overflow-y: auto;

            overflow-x: hidden;

            padding: 8px;

            background: red !important;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        .message-row {

            width: 100%;

            display: grid;

            grid-template-columns:
                56px
                minmax(0, 1fr);

            grid-template-rows:
                auto
                auto
                auto;

            column-gap: 11px;

            padding:
                9px
                2px;

            margin: 0;

            border-radius: 5px;

            position: relative;
        }


        .message-row:hover {

            background: #2e3035;
        }


        /* =====================================================
           AVATAR
           ===================================================== */

        .avatar {

            grid-column: 1;

            grid-row: 1;

            width: 56px;

            height: 56px;

            border-radius: 50%;

            object-fit: cover;

            margin-top: 1px;
        }


        /* =====================================================
           MESSAGE CONTENT
           ===================================================== */

        .message-content-wrapper {

            grid-column: 2;

            grid-row: 1;

            width: 100%;

            min-width: 0;

            word-break: break-word;

            overflow-wrap: anywhere;
        }


        .message-header {

            width: 100%;

            line-height: 42px;
        }


        /* =====================================================
           NAMA — 36PX
           ===================================================== */

        .message-username {

            display: block;

            color: lime !important;

            font-size: 36px !important;

            line-height: 42px !important;

            font-weight: bold !important;

            margin: 0;

            padding: 0;
        }


        /* =====================================================
           PESAN — 36PX
           ===================================================== */

        .message-text {

            display: block;

            color: yellow !important;

            font-size: 36px !important;

            line-height: 1.4 !important;

            font-weight: normal;

            white-space: pre-wrap;

            word-break: break-word;

            overflow-wrap: anywhere;

            margin: 0;

            padding: 0;
        }


        /* =====================================================
           TRANSLATION
           ===================================================== */

        .translation-text {

            display: block;

            color: #00ff88 !important;

            font-size: 24px !important;

            line-height: 1.4;

            margin-top: 5px;

            word-break: break-word;
        }


        /* =====================================================
           REPLY
           ===================================================== */

        .reply-indicator {

            color: #ffffff;

            font-size: 20px !important;

            line-height: 26px;

            margin-bottom: 4px;
        }


        /* =====================================================
           IMAGE
           ===================================================== */

        .chat-img {

            display: block;

            max-width: 100%;

            max-height: 450px;

            border-radius: 8px;

            margin-top: 8px;
        }


        /* =====================================================
           ACTION BAR
           ===================================================== */

        .message-actions {

            grid-column: 2;

            grid-row: 2;

            display: none;

            flex-wrap: wrap;

            align-items: center;

            width: fit-content;

            max-width: 100%;

            gap: 4px;

            margin-top: 7px;

            padding: 5px;

            background: #2b2d31;

            border:
                1px solid #1f2023;

            border-radius: 7px;

            z-index: 100;
        }


        .message-row.show-actions
        .message-actions {

            display: flex;
        }


        .action-icon-btn {

            min-width: 44px;

            min-height: 44px;

            padding: 9px;

            border: none;

            border-radius: 5px;

            background: transparent;

            color: white;

            font-size: 23px !important;
        }


        /* =====================================================
           EMOJI
           ===================================================== */

        .emoji-picker-dialog {

            grid-column: 2;

            grid-row: 3;

            display: none;

            width:
                min(
                    350px,
                    calc(100vw - 70px)
                );

            max-height: 280px;

            margin-top: 6px;

            padding: 10px;

            background: #313338;

            border:
                1px solid #1f2023;

            border-radius: 8px;

            overflow-y: auto;

            z-index: 200;
        }


        .emoji-picker-dialog.show {

            display: block;
        }


        .emoji-grid {

            display: flex;

            flex-wrap: wrap;

            gap: 5px;
        }


        .emoji-item {

            width: 45px;

            height: 45px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 31px !important;

            border-radius: 5px;
        }


        /* =====================================================
           REACTION
           ===================================================== */

        .reaction-container {

            display: flex;

            flex-wrap: wrap;

            gap: 5px;

            margin-top: 7px;
        }


        .reaction-btn {

            background: #2b2d31;

            border:
                1px solid transparent;

            border-radius: 18px;

            padding:
                5px
                11px;

            font-size: 18px !important;

            color: #b5bac1;
        }


        /* =====================================================
           EDIT
           ===================================================== */

        .edit-box {

            display: flex;

            flex-wrap: wrap;

            gap: 5px;

            margin-top: 7px;

            width: 100%;
        }


        .edit-input {

            flex: 1;

            min-width: 120px;

            background: #1e1f22;

            color: white;

            border:
                1px solid #5865F2;

            border-radius: 5px;

            padding: 10px;

            font-size: 20px !important;
        }


        .edit-save,
        .edit-cancel {

            border: none;

            border-radius: 5px;

            padding:
                9px
                12px;

            font-size: 17px !important;
        }


        /* =====================================================
           BOTTOM
           ===================================================== */

        .bottom-panel {

            width: 100%;

            flex-shrink: 0;

            padding:
                0
                8px
                8px;

            background: #313338;
        }


        #typing-indicator {

            height: 22px;

            font-size: 16px !important;

            line-height: 22px;

            color: #949ba4;
        }


        .input-wrapper {

            width: 100%;

            background: #383a40;

            border-radius: 8px;

            padding:
                7px
                9px;
        }


        .reply-preview-bar {

            display: none;

            width: 100%;

            align-items: center;

            justify-content: space-between;

            background: #2b2d31;

            border-radius: 5px;

            padding:
                7px
                9px;

            margin-bottom: 5px;

            font-size: 16px !important;
        }


        .input-container {

            width: 100%;

            display: flex;

            flex-direction: column;

            gap: 5px;
        }


        /* =====================================================
           TEXT INPUT — 36PX UNTUK TES
           ===================================================== */

        textarea#messageInput {

            width: 100%;

            height: 60px;

            min-height: 60px;

            max-height: 150px;

            background: transparent;

            color: white;

            border: none;

            outline: none;

            resize: none;

            font-family: inherit;

            font-size: 36px !important;

            line-height: 1.3 !important;

            padding: 5px 0;

            margin: 0;
        }


        textarea#messageInput::placeholder {

            color: #949ba4;
        }


        .input-actions-bar {

            width: 100%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-top:
                1px solid #3f4248;

            padding-top: 6px;
        }


        .file-upload-btn {

            display: inline-flex;

            align-items: center;

            gap: 5px;

            background: #4e5058;

            color: white;

            padding:
                8px
                10px;

            border-radius: 5px;

            font-size: 16px !important;
        }


        .send-btn {

            background: #5865F2;

            color: white;

            border: none;

            border-radius: 5px;

            padding:
                9px
                16px;

            font-size: 19px !important;

            font-weight: bold;
        }


        #fileName {

            font-size: 14px !important;
        }


        /* =====================================================
           PROFILE
           ===================================================== */

        #profile-modal {

            width:
                calc(100% - 30px);

            max-width: 500px;

            background: #313338;

            border:
                1px solid #1f2023;

            border-radius: 10px;

            padding: 25px;

            margin: 50px auto;

            text-align: center;
        }


        #profile-modal h3 {

            font-size: 30px !important;
        }


        #profile-modal input {

            font-size: 20px !important;
        }


        #profile-modal label {

            font-size: 18px !important;
        }


        #profile-modal button {

            font-size: 20px !important;

            padding:
                13px
                20px !important;
        }


        /* =====================================================
           MEMBER DIALOG
           ===================================================== */

        .modal-overlay {

            display: none;

            position: fixed;

            inset: 0;

            width: 100vw;

            height: 100vh;

            background:
                rgba(0,0,0,.7);

            z-index: 300;
        }


        .dialog-box {

            width:
                calc(100% - 24px);

            max-width: 500px;

            max-height: 80vh;

            overflow-y: auto;

            margin:
                45px auto;

            padding: 20px;

            background: #313338;

            border:
                1px solid #1f2023;

            border-radius: 10px;

            position: relative;
        }


        .dialog-box h3 {

            font-size: 27px !important;
        }


        .close-dialog {

            position: absolute;

            top: 9px;

            right: 12px;

            background: none;

            border: none;

            color: #949ba4;

            font-size: 32px !important;
        }


        /* =====================================================
           GENERAL INPUT
           ===================================================== */

        input[type="text"],
        input[type="file"] {

            width: 100%;

            background: #1e1f22;

            color: white;

            border:
                1px solid #1f2023;

            border-radius: 5px;

            padding: 10px;

            font-size: 20px !important;
        }

    </style>

</head>


<body>


<!-- =========================================================
     PROFILE
     ========================================================= -->

<div id="profile-modal">

    <h3 style="color:white;margin-top:0;">
        Atur Profil Anda
    </h3>

    <input
        type="text"
        id="usernameInput"
        placeholder="Masukkan nama..."
        style="margin-bottom:12px;"
    >

    <br>

    <label
        style="
            display:block;
            margin-bottom:6px;
            color:#b5bac1;
            text-align:left;
        "
    >
        Pilih Foto Profil:
    </label>

    <input
        type="file"
        id="avatarInput"
        accept="image/*"
        style="margin-bottom:18px;"
    >

    <br>

    <button
        onclick="joinChat()"
        style="
            background:#5865F2;
            color:white;
            border:none;
            border-radius:5px;
            font-weight:bold;
            cursor:pointer;
            width:100%;
        "
    >
        Gabung Chat
    </button>

</div>


<!-- =========================================================
     MEMBER
     ========================================================= -->

<div
    id="memberDialog"
    class="modal-overlay"
>

    <div class="dialog-box">

        <button
            class="close-dialog"
            onclick="toggleMemberDialog()"
        >
            &times;
        </button>

        <h3
            style="
                margin-top:0;
                color:white;
                border-bottom:1px solid #3f4248;
            "
        >
            Anggota Online
        </h3>

        <div
            id="member-list"
            style="margin-top:15px;"
        ></div>

    </div>

</div>


<!-- =========================================================
     APP
     ========================================================= -->

<div
    id="app-container"
    style="display:none;"
    class="main-chat-container"
>


    <!-- HEADER -->

    <div class="chat-header">

        <div class="header-right-group">

            <div class="vertical-controls">

                <select
                    id="channelSelect"
                    onchange="changeChannelHeader()"
                >

                    <option value="umum">
                        # umum
                    </option>

                    <option value="gaming">
                        # gaming
                    </option>

                    <option value="musik">
                        # musik
                    </option>

                </select>


                <select
                    id="targetLang"
                    onchange="changeLanguage()"
                    title="Pilih Bahasa Terjemahan"
                >

                    <option value="id">
                        🇮🇩 Indonesia
                    </option>

                    <option value="en">
                        🇬🇧 English
                    </option>

                    <option value="ms">
                        🇲🇾 Melayu
                    </option>

                    <option value="jv">
                        Jawa
                    </option>

                    <option value="su">
                        Sunda
                    </option>

                    <option value="zh-CN">
                        🇨🇳 Mandarin
                    </option>

                    <option value="ja">
                        🇯🇵 Japanese
                    </option>

                    <option value="ko">
                        🇰🇷 Korean
                    </option>

                    <option value="ar">
                        🇸🇦 Arabic
                    </option>

                    <option value="es">
                        🇪🇸 Spanish
                    </option>

                </select>

            </div>


            <button
                onclick="toggleMemberDialog()"
                id="memberBtn"
                style="
                    background:#35373c;
                    color:#dbdee1;
                "
            >
                👥 (0)
            </button>


            <button
                onclick="clearAllChat()"
                style="
                    background:#da373c;
                    color:white;
                "
            >
                🗑️ Hapus
            </button>

        </div>

    </div>


    <!-- CHAT -->

    <div id="chat-box"></div>


    <!-- INPUT -->

    <div class="bottom-panel">

        <div id="typing-indicator"></div>

        <div class="input-wrapper">

            <div
                id="replyPreviewBar"
                class="reply-preview-bar"
            >

                <span
                    id="replyPreviewText"
                    class="reply-preview-text"
                >
                    Membalas ke...
                </span>

                <button
                    class="cancel-reply-btn"
                    onclick="cancelReply()"
                >
                    &times;
                </button>

            </div>


            <div class="input-container">

                <textarea
                    id="messageInput"
                    placeholder="Ketik pesan..."
                    oninput="handleTyping()"
                    onkeypress="handleKeyPress(event)"
                ></textarea>


                <div class="input-actions-bar">

                    <div>

                        <input
                            type="file"
                            id="imageInput"
                            accept="image/*"
                            style="display:none;"
                            onchange="updateFileLabel()"
                        >

                        <label
                            for="imageInput"
                            id="fileBtn"
                            class="file-upload-btn"
                        >
                            📎 Unggah Gambar
                        </label>

                        <span
                            id="fileName"
                            style="color:#23a55a;"
                        ></span>

                    </div>


                    <button
                        id="sendBtn"
                        class="send-btn"
                        type="button"
                        onclick="sendMessage()"
                    >
                        Kirim
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================================
   SOCKET
   ========================================================= */

const socket = io();

let username = '';

let userAvatar =
    'https://via.placeholder.com/64';

let myTargetLang = 'id';

let messageHistory = [];

let typingTimeout = null;

let replyingToId = null;


/* =========================================================
   CONNECTION
   ========================================================= */

socket.on(
    'connect',
    function() {

        console.log(
            'Socket terhubung:',
            socket.id
        );

        if (username) {

            socket.emit(
                'set_user_profile',
                {
                    username:
                        username,

                    avatar:
                        userAvatar
                }
            );
        }
    }
);


socket.on(
    'connect_error',
    function(error) {

        console.error(
            'Socket error:',
            error
        );
    }
);


/* =========================================================
   LOAD
   ========================================================= */

window.onload =
function() {

    const savedName =
        localStorage.getItem(
            'chat_username'
        );

    const savedAvatar =
        localStorage.getItem(
            'chat_avatar'
        );


    if (savedName) {

        username =
            savedName;


        if (savedAvatar) {

            userAvatar =
                savedAvatar;
        }


        registerAndEnter();
    }
};


/* =========================================================
   MEMBER
   ========================================================= */

function toggleMemberDialog() {

    const modal =
        document.getElementById(
            'memberDialog'
        );


    modal.style.display =
        modal.style.display === 'block'
            ? 'none'
            : 'block';
}


/* =========================================================
   JOIN
   ========================================================= */

function joinChat() {

    const nameVal =
        document
            .getElementById(
                'usernameInput'
            )
            .value
            .trim();


    if (!nameVal) {

        alert(
            'Nama tidak boleh kosong!'
        );

        return;
    }


    username =
        nameVal;


    localStorage.setItem(
        'chat_username',
        username
    );


    const avatarFile =
        document
            .getElementById(
                'avatarInput'
            )
            .files[0];


    if (avatarFile) {

        const reader =
            new FileReader();


        reader.onload =
        function(e) {

            userAvatar =
                e.target.result;


            localStorage.setItem(
                'chat_avatar',
                userAvatar
            );


            registerAndEnter();
        };


        reader.readAsDataURL(
            avatarFile
        );

    } else {

        localStorage.setItem(
            'chat_avatar',
            userAvatar
        );


        registerAndEnter();
    }
}


function registerAndEnter() {

    if (socket.connected) {

        socket.emit(
            'set_user_profile',
            {
                username:
                    username,

                avatar:
                    userAvatar
            }
        );
    }


    document.getElementById(
        'profile-modal'
    ).style.display =
        'none';


    document.getElementById(
        'app-container'
    ).style.display =
        'flex';
}


/* =========================================================
   CHANNEL
   ========================================================= */

function changeChannelHeader() {

    const channelName =
        document.getElementById(
            'channelSelect'
        ).value;


    document.getElementById(
        'messageInput'
    ).placeholder =
        `Kirim pesan ke #${channelName}...`;


    closeAllMessageActions();

    cancelReply();


    socket.emit(
        'switch_channel',
        channelName
    );
}


/* =========================================================
   FILE
   ========================================================= */

function updateFileLabel() {

    const imageInput =
        document.getElementById(
            'imageInput'
        );


    const fileNameSpan =
        document.getElementById(
            'fileName'
        );


    if (
        imageInput.files.length > 0
    ) {

        fileNameSpan.innerText =
            '📎 ' +
            imageInput.files[0].name;

    } else {

        fileNameSpan.innerText =
            '';
    }
}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ''
    ).replace(
        /[&<>"']/g,
        function(ch) {

            return {

                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'

            }[ch];

        }
    );
}


/* =========================================================
   LINK
   ========================================================= */

function linkify(text) {

    const escaped =
        escapeHtml(text);


    return escaped.replace(
        /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig,

        '<a href="$1" target="_blank" rel="noopener noreferrer" style="color:#00b0f4;text-decoration:underline;">$1</a>'
    );
}


/* =========================================================
   TRANSLATE
   ========================================================= */

async function translateText(
    text,
    targetLang
) {

    if (!text) {

        return '';
    }


    try {

        const res =
            await fetch(
                `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`
            );


        const data =
            await res.json();


        return data[0]
            .map(
                item =>
                    item[0]
            )
            .join('');

    } catch (err) {

        return text;
    }
}


/* =========================================================
   SOUND
   ========================================================= */

function playNotificationSound() {

    try {

        const audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const osc =
            audioCtx.createOscillator();


        const gain =
            audioCtx.createGain();


        osc.type =
            'sine';


        osc.frequency.value =
            587.33;


        gain.gain.setValueAtTime(
            0.1,
            audioCtx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.15
        );


        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );


        osc.start();

        osc.stop(
            audioCtx.currentTime + 0.15
        );

    } catch (e) {}
}


/* =========================================================
   REPLY
   ========================================================= */

function startReply(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const msg =
        messageHistory.find(
            m =>
                String(m.id) ===
                String(id)
        );


    if (!msg) {

        return;
    }


    replyingToId =
        id;


    const previewBar =
        document.getElementById(
            'replyPreviewBar'
        );


    const previewText =
        document.getElementById(
            'replyPreviewText'
        );


    if (
        previewBar &&
        previewText
    ) {

        previewText.textContent =
            `Membalas ke ${msg.sender}: ${msg.original || '[Gambar]'}`;


        previewBar.style.display =
            'flex';
    }


    closeAllMessageActions();


    document.getElementById(
        'messageInput'
    ).focus();
}


function cancelReply() {

    replyingToId =
        null;


    const previewBar =
        document.getElementById(
            'replyPreviewBar'
        );


    const previewText =
        document.getElementById(
            'replyPreviewText'
        );


    if (previewBar) {

        previewBar.style.display =
            'none';
    }


    if (previewText) {

        previewText.textContent =
            '';
    }
}


/* =========================================================
   ACTION
   ========================================================= */

function toggleMessageActions(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const row =
        document.getElementById(
            `message-container-${id}`
        );


    if (!row) {

        return;
    }


    const wasOpen =
        row.classList.contains(
            'show-actions'
        );


    closeAllMessageActions();


    if (!wasOpen) {

        row.classList.add(
            'show-actions'
        );
    }
}


function closeAllMessageActions() {

    document
        .querySelectorAll(
            '.message-row.show-actions'
        )
        .forEach(
            function(el) {

                el.classList.remove(
                    'show-actions'
                );
            }
        );


    document
        .querySelectorAll(
            '.emoji-picker-dialog.show'
        )
        .forEach(
            function(el) {

                el.classList.remove(
                    'show'
                );
            }
        );
}


/* =========================================================
   EMOJI
   ========================================================= */

function toggleEmojiPicker(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const row =
        document.getElementById(
            `message-container-${id}`
        );


    const picker =
        document.getElementById(
            `emoji-picker-${id}`
        );


    if (!row || !picker) {

        return;
    }


    const wasOpen =
        picker.classList.contains(
            'show'
        );


    closeAllMessageActions();


    if (!wasOpen) {

        row.classList.add(
            'show-actions'
        );


        picker.classList.add(
            'show'
        );
    }
}


/* =========================================================
   REACTION
   ========================================================= */

function addReaction(
    id,
    emoji,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    id =
        String(id);

    emoji =
        String(emoji);


    if (!socket.connected) {

        return;
    }


    if (!id || !emoji) {

        return;
    }


    socket.emit(
        'add_reaction',
        {
            id:
                id,

            emoji:
                emoji
        }
    );


    const picker =
        document.getElementById(
            `emoji-picker-${id}`
        );


    if (picker) {

        picker.classList.remove(
            'show'
        );
    }
}


/* =========================================================
   OUTSIDE CLICK
   ========================================================= */

window.addEventListener(
    'click',
    function(event) {

        if (
            event.target.closest(
                '.message-row'
            )
        ) {

            return;
        }


        closeAllMessageActions();
    }
);


/* =========================================================
   RENDER
   ========================================================= */

async function renderChat() {

    const chatBox =
        document.getElementById(
            'chat-box'
        );


    if (!chatBox) {

        return;
    }


    chatBox.innerHTML =
        '';


    for (
        const data
        of messageHistory
    ) {

        const id =
            String(data.id);


        let contentHtml =
            '';


        const parentMsg =
            data.replyTo
                ? messageHistory.find(
                    m =>
                        String(m.id) ===
                        String(data.replyTo)
                )
                : null;


        if (parentMsg) {

            contentHtml += `

                <div class="reply-indicator">

                    ↪️

                    <b>
                        ${escapeHtml(parentMsg.sender)}
                    </b>:

                    ${escapeHtml(
                        parentMsg.original ||
                        '[Gambar]'
                    )}

                </div>

            `;
        }


        if (data.original) {

            const translated =
                await translateText(
                    data.original,
                    myTargetLang
                );


            contentHtml += `

                <div
                    class="message-text"
                    id="msg-text-${escapeHtml(id)}"
                >
                    ${linkify(data.original)}

                    ${
                        data.edited
                            ? ' <small>(diedit)</small>'
                            : ''
                    }

                </div>

            `;


            if (
                translated &&
                translated !==
                data.original
            ) {

                contentHtml += `

                    <small
                        class="translation-text"
                    >

                        🌐
                        (Terjemahan
                        [${escapeHtml(myTargetLang)}]:
                        ${linkify(translated)})

                    </small>

                `;
            }
        }


        if (data.image) {

            contentHtml += `

                <img
                    src="${escapeHtml(data.image)}"
                    class="chat-img"
                >

            `;
        }


        let reactionsHtml =
            '';


        if (
            data.reactions &&
            Object.keys(
                data.reactions
            ).length > 0
        ) {

            reactionsHtml =
                '<div class="reaction-container">';


            for (
                const [
                    emoji,
                    usersList
                ]
                of Object.entries(
                    data.reactions
                )
            ) {

                const hasReacted =
                    Array.isArray(
                        usersList
                    ) &&
                    usersList.includes(
                        username
                    );


                const safeId =
                    JSON.stringify(id);


                const safeEmoji =
                    JSON.stringify(
                        emoji
                    );


                reactionsHtml += `

                    <button
                        type="button"
                        class="reaction-btn ${hasReacted ? 'active' : ''}"
                        onclick='addReaction(${safeId}, ${safeEmoji}, event)'
                    >

                        ${escapeHtml(emoji)}

                        <span>
                            ${
                                Array.isArray(
                                    usersList
                                )
                                    ? usersList.length
                                    : 0
                            }
                        </span>

                    </button>

                `;
            }


            reactionsHtml +=
                '</div>';
        }


        let actionButtonsHtml = `

            <button
                type="button"
                class="action-icon-btn"
                onclick='startReply(${JSON.stringify(id)}, event)'
            >
                ↩️
            </button>

        `;


        actionButtonsHtml += `

            <button
                type="button"
                class="action-icon-btn"
                onclick='toggleEmojiPicker(${JSON.stringify(id)}, event)'
            >
                😀
            </button>

        `;


        actionButtonsHtml += `

            <button
                type="button"
                class="action-icon-btn"
                onclick='copyText(${JSON.stringify(data.original || '')}, this); event.stopPropagation();'
            >
                📋
            </button>

        `;


        if (
            data.sender === username &&
            data.original
        ) {

            actionButtonsHtml += `

                <button
                    type="button"
                    class="action-icon-btn"
                    onclick='enableEdit(${JSON.stringify(id)}, event)'
                >
                    ✏️
                </button>

            `;
        }


        if (
            data.sender === username
        ) {

            actionButtonsHtml += `

                <button
                    type="button"
                    class="action-icon-btn"
                    onclick='deleteMessage(${JSON.stringify(id)}, event)'
                >
                    🗑️
                </button>

            `;
        }


        const emojiList = [

            '👍',
            '❤️',
            '😂',
            '😮',
            '😢',
            '🔥',
            '🎉',
            '🙏'

        ];


        let emojiHtml =
            '';


        for (
            const emoji
            of emojiList
        ) {

            emojiHtml += `

                <div
                    class="emoji-item"
                    onclick='addReaction(${JSON.stringify(id)}, ${JSON.stringify(emoji)}, event)'
                >
                    ${emoji}
                </div>

            `;
        }


        chatBox.innerHTML += `

            <div
                class="message-row"
                id="message-container-${escapeHtml(id)}"
                onclick='toggleMessageActions(${JSON.stringify(id)}, event)'
            >

                <img
                    src="${escapeHtml(
                        data.avatar ||
                        'https://via.placeholder.com/64'
                    )}"
                    class="avatar"
                >


                <div
                    class="message-content-wrapper"
                >

                    <div
                        class="message-header"
                    >

                        <span
                            class="message-username"
                        >
                            ${escapeHtml(
                                data.sender
                            )}
                        </span>

                    </div>


                    ${contentHtml}

                    ${reactionsHtml}

                </div>


                <div
                    class="message-actions"
                    onclick="event.stopPropagation()"
                >

                    ${actionButtonsHtml}

                </div>


                <div
                    id="emoji-picker-${escapeHtml(id)}"
                    class="emoji-picker-dialog"
                    onclick="event.stopPropagation()"
                >

                    <div class="emoji-grid">

                        ${emojiHtml}

                    </div>

                </div>

            </div>

        `;
    }


    chatBox.scrollTop =
        chatBox.scrollHeight;
}


/* =========================================================
   EDIT
   ========================================================= */

function enableEdit(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const textEl =
        document.getElementById(
            `msg-text-${id}`
        );


    const msg =
        messageHistory.find(
            m =>
                String(m.id) ===
                String(id)
        );


    if (!textEl || !msg) {

        return;
    }


    if (
        document.getElementById(
            `edit-box-${id}`
        )
    ) {

        return;
    }


    const editDiv =
        document.createElement(
            'div'
        );


    editDiv.id =
        `edit-box-${id}`;


    editDiv.className =
        'edit-box';


    editDiv.innerHTML = `

        <input
            type="text"
            id="edit-input-${escapeHtml(id)}"
            class="edit-input"
        >

        <button
            type="button"
            class="edit-save"
            onclick='saveEdit(${JSON.stringify(id)}, event)'
        >
            Simpan
        </button>

        <button
            type="button"
            class="edit-cancel"
            onclick='cancelEdit(${JSON.stringify(id)}, event)'
        >
            Batal
        </button>

    `;


    textEl.style.display =
        'none';


    textEl.parentNode.insertBefore(
        editDiv,
        textEl.nextSibling
    );


    const input =
        document.getElementById(
            `edit-input-${id}`
        );


    if (!input) {

        return;
    }


    input.value =
        msg.original || '';


    input.focus();

    input.select();
}


function cancelEdit(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const editBox =
        document.getElementById(
            `edit-box-${id}`
        );


    const textEl =
        document.getElementById(
            `msg-text-${id}`
        );


    if (editBox) {

        editBox.remove();
    }


    if (textEl) {

        textEl.style.display =
            '';
    }
}


function saveEdit(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    const inputEl =
        document.getElementById(
            `edit-input-${id}`
        );


    if (!inputEl) {

        return;
    }


    const newText =
        inputEl.value.trim();


    if (!newText) {

        return;
    }


    socket.emit(
        'edit_message',
        {
            id:
                id,

            newText:
                newText
        }
    );


    const editBox =
        document.getElementById(
            `edit-box-${id}`
        );


    const textEl =
        document.getElementById(
            `msg-text-${id}`
        );


    if (editBox) {

        editBox.remove();
    }


    if (textEl) {

        textEl.style.display =
            '';
    }


    closeAllMessageActions();
}


/* =========================================================
   COPY
   ========================================================= */

function copyText(
    text,
    btnElement
) {

    if (
        navigator.clipboard &&
        navigator.clipboard.writeText
    ) {

        navigator.clipboard
            .writeText(text)
            .then(
                function() {

                    const orig =
                        btnElement.innerHTML;


                    btnElement.innerHTML =
                        '✅';


                    setTimeout(
                        function() {

                            btnElement.innerHTML =
                                orig;

                        },
                        1500
                    );
                }
            )
            .catch(
                function() {}
            );

    } else {

        const temp =
            document.createElement(
                'textarea'
            );


        temp.value =
            text;


        document.body.appendChild(
            temp
        );


        temp.select();


        try {

            document.execCommand(
                'copy'
            );

        } catch (e) {}


        temp.remove();
    }
}


/* =========================================================
   LANGUAGE
   ========================================================= */

async function changeLanguage() {

    myTargetLang =
        document.getElementById(
            'targetLang'
        ).value;


    await renderChat();
}


/* =========================================================
   DELETE
   ========================================================= */

function deleteMessage(
    id,
    event
) {

    if (event) {

        event.preventDefault();

        event.stopPropagation();
    }


    socket.emit(
        'delete_message',
        String(id)
    );


    closeAllMessageActions();
}


/* =========================================================
   CLEAR
   ========================================================= */

function clearAllChat() {

    if (
        confirm(
            'Yakin ingin menghapus seluruh riwayat chat di channel ini?'
        )
    ) {

        socket.emit(
            'clear_all_chat'
        );
    }
}


/* =========================================================
   KEYBOARD
   ========================================================= */

function handleKeyPress(e) {

    if (
        e.key === 'Enter' &&
        !e.shiftKey
    ) {

        e.preventDefault();

        sendMessage();
    }
}


/* =========================================================
   TYPING
   ========================================================= */

function handleTyping() {

    socket.emit(
        'typing',
        username
    );


    clearTimeout(
        typingTimeout
    );


    typingTimeout =
        setTimeout(
            function() {

                socket.emit(
                    'stop_typing'
                );

            },
            1000
        );
}


/* =========================================================
   SEND
   ========================================================= */

function sendMessage() {

    const messageInput =
        document.getElementById(
            'messageInput'
        );


    const imageInput =
        document.getElementById(
            'imageInput'
        );


    const message =
        messageInput.value.trim();


    if (
        !message &&
        imageInput.files.length === 0
    ) {

        return;
    }


    socket.emit(
        'stop_typing'
    );


    const messageData = {

        sender:
            username,

        avatar:
            userAvatar,

        original:
            message,

        image:
            null,

        replyTo:
            replyingToId
    };


    if (
        imageInput.files.length > 0
    ) {

        const reader =
            new FileReader();


        reader.onload =
        function(e) {

            messageData.image =
                e.target.result;


            socket.emit(
                'send_message',
                messageData
            );


            resetForm();
        };


        reader.readAsDataURL(
            imageInput.files[0]
        );

    } else {

        socket.emit(
            'send_message',
            messageData
        );


        resetForm();
    }
}


/* =========================================================
   RESET
   ========================================================= */

function resetForm() {

    document.getElementById(
        'messageInput'
    ).value =
        '';


    document.getElementById(
        'imageInput'
    ).value =
        '';


    document.getElementById(
        'fileName'
    ).innerText =
        '';


    cancelReply();
}


/* =========================================================
   RECEIVE HISTORY
   ========================================================= */

socket.on(
    'receive_history',
    async function(history) {

        if (
            messageHistory.length > 0 &&
            history.length >
            messageHistory.length
        ) {

            const latestMsg =
                history[
                    history.length - 1
                ];


            if (
                latestMsg &&
                latestMsg.sender !==
                username
            ) {

                playNotificationSound();
            }
        }


        messageHistory =
            Array.isArray(history)
                ? history
                : [];


        await renderChat();
    }
);


/* =========================================================
   DELETE
   ========================================================= */

socket.on(
    'message_deleted',
    async function(history) {

        messageHistory =
            Array.isArray(history)
                ? history
                : [];


        await renderChat();
    }
);


/* =========================================================
   EDIT
   ========================================================= */

socket.on(
    'message_edited',
    async function(history) {

        messageHistory =
            Array.isArray(history)
                ? history
                : [];


        await renderChat();
    }
);


/* =========================================================
   REACTION
   ========================================================= */

socket.on(
    'reaction_updated',
    async function(history) {

        messageHistory =
            Array.isArray(history)
                ? history
                : [];


        await renderChat();
    }
);


/* =========================================================
   TYPING DISPLAY
   ========================================================= */

socket.on(
    'display_typing',
    function(typingUser) {

        document.getElementById(

        ).innerText =

socket.on(
    'hide_typing',
    function() {

        document.getElementById(
            'typing-indicator'

            '';
    }
);


/* =========================================================
   USERS
   ========================================================= */

socket.on(
    'update_users',

            Array.isArray(users)

        const onlineCount =

        document.getElementById(

                            style="

                        >


                        <span

                            "
                        >
                            ${escapeHtml(
                                user.username
                            )}

                    </div>

                `;
            }
        );

    }
);

</script>
