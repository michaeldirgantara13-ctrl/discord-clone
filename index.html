<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Chat & Panggilan Suara</title>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --chat-bg: #ffffff;
            --text-color: #1f2937;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --incoming-msg: #f3f4f6;
            --outgoing-msg: #4f46e5;
            --outgoing-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Modal Profil Awal */
        #profile-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
        }

        .modal-content button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .modal-content button:hover {
            background: var(--primary-hover);
        }

        /* Layar Pemblokiran */
        #blocked-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: white;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1100;
            text-align: center;
            padding: 20px;
        }

        #blocked-screen h1 {
            color: #ef4444;
            margin-bottom: 10px;
        }

        /* Container Aplikasi Utama */
        #app-container {
            display: none;
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            flex-direction: column;
        }

        /* Header Chat */
        header {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-status-dot {
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-actions select {
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .call-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .call-btn:hover {
            background: #059669;
        }

        /* Area Pesan */
        #chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fafafa;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 12px;
            position: relative;
            word-wrap: break-word;
            font-size: 15px;
        }

        .message.incoming {
            background: var(--incoming-msg);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.outgoing {
            background: var(--outgoing-msg);
            color: var(--outgoing-text);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .message-info {
            font-size: 11px;
            margin-top: 5px;
            text-align: right;
            opacity: 0.8;
        }

        /* Input Area */
        .chat-input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        .chat-input-area button {
            background: var(--primary-color);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            transition: background 0.2s;
        }

        .chat-input-area button:hover {
            background: var(--primary-hover);
        }

        /* Dialog Panggilan Masuk/Aktif */
        #call-dialog {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: none;
            z-index: 1200;
            text-align: center;
        }

        #call-dialog h3 {
            margin-bottom: 15px;
        }

        .call-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-accept { background: #10b981; color: white; padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; }
        .btn-reject { background: #ef4444; color: white; padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; }

        @media (max-width: 600px) {
            #app-container {
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Modal Masuk/Profil Awal -->
    <div id="profile-modal">
        <div class="modal-content">
            <h2>Bergabung ke Chat</h2>
            <input type="text" id="usernameInput" placeholder="Masukkan nama Anda..." autocomplete="off">
            <select id="targetLangJoin">
                <option value="id">Bahasa Indonesia</option>
                <option value="en">English</option>
                <option value="es">Español</option>
            </select>
            <button onclick="joinChat()">Mulai Chat</button>
        </div>
    </div>

    <!-- Layar Pemblokiran -->
    <div id="blocked-screen">
        <h1>Akses Ditolak</h1>
        <p>Anda telah diblokir dari ruang obrolan ini.</p>
    </div>

    <!-- Aplikasi Chat Utama -->
    <div id="app-container">
        <header>
            <div class="header-left">
                <span class="user-status-dot"></span>
                <div>
                    <h3 id="current-user-display">Nama Pengguna</h3>
                    <small style="color: var(--text-light);">Online</small>
                </div>
            </div>
            <div class="header-actions">
                <select id="targetLang" onchange="changeLanguage(this)">
                    <option value="id">ID</option>
                    <option value="en">EN</option>
                    <option value="es">ES</option>
                </select>
                <button class="call-btn" onclick="startCall()"><i class="fas fa-phone"></i> Panggil</button>
            </div>
        </header>

        <!-- Area Pesan -->
        <div id="chat-messages">
            <!-- Pesan akan masuk secara dinamis di sini -->
        </div>

        <!-- Area Input Chat -->
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Dialog Panggilan -->
    <div id="call-dialog">
        <h3 id="call-status-text">Panggilan Masuk...</h3>
        <div class="call-actions" id="call-action-buttons">
            <button class="btn-accept" onclick="acceptCall()">Terima</button>
            <button class="btn-reject" onclick="rejectCall()">Tolak</button>
        </div>
    </div>

    <!-- Audio untuk WebRTC -->
    <audio id="remoteAudio" autoplay></audio>

    <script>
        const socket = io();
        let myUsername = '';
        let targetLanguage = 'id';
        let youAreBlocked = false;

        // Variabel WebRTC
        let peerConnection;
        let localStream;
        let isCalling = false;

        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' }
            ]
        };

        function joinChat() {
            const usernameInput = document.getElementById('usernameInput').value.trim();
            const langSelect = document.getElementById('targetLangJoin').value;

            if (!usernameInput) {
                alert('Silakan masukkan nama Anda terlebih dahulu!');
                return;
            }

            myUsername = usernameInput;
            targetLanguage = langSelect;
            document.getElementById('targetLang').value = targetLanguage;
            document.getElementById('current-user-display').innerText = myUsername;

            // Emit event ke server
            socket.emit('join', { username: myUsername, lang: targetLanguage });

            // Sembunyikan modal, tampilkan aplikasi
            document.getElementById('profile-modal').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
        }

        function changeLanguage(selectElem) {
            targetLanguage = selectElem.value;
            socket.emit('change_language', { lang: targetLanguage });
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();

            if (!text || youAreBlocked) return;

            socket.emit('chat_message', { message: text });
            input.value = '';
        }

        // Listener Socket.io untuk Pesan
        socket.on('chat_message', function(data) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            
            const isOutgoing = data.username === myUsername;
            messageDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;

            messageDiv.innerHTML = `
                ${!isOutgoing ? `<div style="font-size: 11px; font-weight: bold; margin-bottom: 3px; color: var(--primary-color);">${data.username}</div>` : ''}
                <div>${data.message}</div>
                <div class="message-info">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // Listener jika user diblokir
        socket.on('you_are_blocked', function() {
            youAreBlocked = true;
            document.getElementById('profile-modal').style.display = 'none';
            document.getElementById('app-container').style.display = 'none';
            
            // Perbaikan ID dari blockedDialog menjadi blocked-screen
            document.getElementById('blocked-screen').style.display = 'flex';
        });

        // --- Fitur WebRTC Voice Call Sederhana ---
        async function startCall() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                createPeerConnection();
                
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                socket.emit('call_offer', { offer: offer });
                
                document.getElementById('call-status-text').innerText = 'Memanggil...';
                document.getElementById('call-action-buttons').style.display = 'none';
                document.getElementById('call-dialog').style.display = 'block';
                isCalling = true;
            } catch (err) {
                console.error('Gagal mengakses mikrofon:', err);
                alert('Tidak dapat memulai panggilan karena izin mikrofon ditolak.');
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(iceServers);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice_candidate', { candidate: event.candidate });
                }
            };

            peerConnection.ontrack = (event) => {
                const remoteAudio = document.getElementById('remoteAudio');
                remoteAudio.srcObject = event.streams[0];
            };
        }

        socket.on('call_offer', async function(data) {
            if (isCalling) return; // Sedang sibuk

            document.getElementById('call-status-text').innerText = 'Panggilan Masuk...';
            document.getElementById('call-action-buttons').style.display = 'flex';
            document.getElementById('call-dialog').style.display = 'block';

            window.incomingOffer = data.offer;
        });

        async function acceptCall() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                createPeerConnection();

                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                await peerConnection.setRemoteDescription(new RTCSessionDescription(window.incomingOffer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                socket.emit('call_answer', { answer: answer });

                document.getElementById('call-status-text').innerText = 'Panggilan Terhubung';
                document.getElementById('call-action-buttons').style.display = 'none';
                isCalling = true;

                setTimeout(() => {
                    document.getElementById('call-dialog').style.display = 'none';
                }, 1500);
            } catch (err) {
                console.error('Gagal menerima panggilan:', err);
            }
        }

        socket.on('call_answer', async function(data) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            document.getElementById('call-status-text').innerText = 'Panggilan Terhubung';
            setTimeout(() => {
                document.getElementById('call-dialog').style.display = 'none';
            }, 1500);
        });

        socket.on('ice_candidate', async function(data) {
            if (peerConnection) {
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                } catch (e) {
                    console.error('Gagal menambahkan ICE candidate', e);
                }
            }
        });

        function rejectCall() {
            socket.emit('call_rejected');
            closeCall();
        }

        socket.on('call_rejected', function() {
            alert('Panggilan ditolak.');
            closeCall();
        });

        function closeCall() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            isCalling = false;
            document.getElementById('call-dialog').style.display = 'none';
        }
    </script>
</body>
</html>
